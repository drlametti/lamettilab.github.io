<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title_tag %}{{ page.title_tag }}{% else %}Dan Lametti | Psycholinguist, AI Researcher, and Speaker{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="site-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} · Acadia University</p>
      <p>
        <a href="mailto:{{ site.email }}">Email</a> |
        <a href="{{ site.linkedin }}">LinkedIn</a> |
        <a href="{{ site.bluesky }}">Bluesky</a>
      </p>
    </div>
  </footer>
</body>
</html>
